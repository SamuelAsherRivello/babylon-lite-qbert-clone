schema: spec-driven
context: |
  Qbert Clone is a single-screen portrait browser arcade game.
  Repository babylon-lite-qbert-clone; application root qbert-clone; npm root here.
  Use @babylonjs/lite and WebGPU with Vite and JavaScript. No backend or secrets.
  Preserve Q*bert's isometric diagonal hopping and pyramid color-change rules.
  Use original metallic art, keyboard and touch controls, and GitHub Pages.
  Separate deterministic game rules from renderer and DOM controls.
  Verify with npm test, npm run build, and browser play on desktop and mobile sizes.
rules:
  proposal:
    - Mark unresolved decisions clearly; recommendations are not approvals.
    - State the affected user behavior and acceptance criteria.
  design:
    - Describe only architecture and technologies verified for this project.
    - Preserve explicit boundaries between application layers or packages.
  tasks:
    - Keep planning, implementation, and verification tasks explicit.
    - Include focused checks appropriate to the implemented change.

